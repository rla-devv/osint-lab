<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dossiê: {{ d.consulta }}</title>
<style>body{font:15px/1.5 system-ui,Segoe UI,sans-serif;max-width:60rem;margin:2rem auto;padding:0 1rem;color:#1a2433}
table{border-collapse:collapse;width:100%;margin:.5rem 0}th,td{border-bottom:1px solid #dde3ea;padding:.3rem .4rem;text-align:left;vertical-align:top}
.cartao{border:1px solid #dde3ea;border-radius:8px;padding:.6rem 1rem;margin:1rem 0}.destaque{border-left:4px solid #2a6fd6}
.tag{display:inline-block;padding:0 .4rem;border-radius:4px;font-size:.75rem;background:#e6ecf3}.nv-documental,.nv-corroborada,.confirmado{background:#cdeed8}
.nv-provavel,.possivel{background:#d9e6ff}.nv-hipotese{background:#ffe7bf}.nv-contraditorio,.alerta{background:#ffd6d2}.nota,.meta{color:#5a6675;font-size:.88rem}</style></head>
<body><h1>Dossiê: {{ d.consulta }}</h1><p class="meta">{% if p %}Caso {{ p.name }} · finalidade do caso: {{ p.purpose }}{% else %}Pesquisa avulsa{% if d.finalidade %} · finalidade: {{ d.finalidade }}{% endif %}{% endif %} · OSINT Lab</p>
{% set grafo = False %}{% include "_dossie_corpo.html" %}</body></html>
