{% extends "base.html" %}
{% block content %}
<section class="cartao" style="max-width:440px;margin:2.5rem auto"><h1>Entrar no OSINT Lab</h1>
<p class="nota">Acesso remoto protegido. Informe a senha{% if totp %} e o código do aplicativo autenticador{% endif %}.</p>
{% if erro %}<p class="msg erro">{{ erro }}</p>{% endif %}
<form method="post" action="/entrar" class="form">
<input type="hidden" name="proximo" value="{{ proximo }}">
<label>Senha<input type="password" name="senha" required autofocus autocomplete="current-password"></label>
{% if totp %}<label>Código de 6 dígitos<input name="codigo" inputmode="numeric" pattern="[0-9 ]{6,7}" maxlength="7" required autocomplete="one-time-code"></label>{% endif %}
<button>Entrar</button></form></section>
{% endblock %}
